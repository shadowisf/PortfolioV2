  <!-- the logo's letter, ᜎ. The svg follows the browser's light or dark tabs;

       and its icons sit in public/, at the fixed paths browsers look for;
       the rest go through the build, so a change gets a new name. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/src/favicons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/src/favicons/safari-pinned-tab.svg" color="#1c1c1e">
  <meta name="theme-color" content="rgb(0, 0, 0, 0)">
</head>
